<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNUDGLOT</title>
    <style>
body {
    font-family: 'Inter', sans-serif;
    background: #ECE7DE;
    color: #222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:750px;
    background:#F4F0E8;
    border:5px solid #1A1A1A;
    border-radius:0;
    padding:35px;
    box-shadow:12px 12px 0 #1A1A1A;
}

h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px;
    letter-spacing:1px;
    color:#1A1A1A;
    margin-bottom:20px;
    text-align:center;
}

.mode-selector{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
}

.mode-btn{
    background:white;
    border:4px solid #1A1A1A;
    color:#1A1A1A;
    padding:12px 22px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.mode-btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:5px 5px 0 #1A1A1A;
}

.mode-btn.active{
    background:#F11308;
    color:white;
    border-color:#1A1A1A;
}

textarea{
    width:100%;
    height:110px;
    border:4px solid #1A1A1A;
    background:white;
    color:#222;
    padding:15px;
    font-size:18px;
    resize:vertical;
    box-sizing:border-box;
}

.output-box{
    margin-top:20px;
    padding:25px;
    background:white;
    border:4px solid #1A1A1A;
    box-shadow:8px 8px 0 #1A1A1A;
    font-size:30px;
    font-weight:700;
    min-height:70px;
    color:#222;
    line-height:1.3;
}

.speech-controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.voice-select {
    padding: 10px;
    border: 4px solid #1A1A1A;
    background: white;
    font-weight: 700;
    cursor: pointer;
}

.speak-btn {
    background: #1A1A1A;
    color: white;
    border: 4px solid #1A1A1A;
    padding: 12px 22px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.speak-btn:hover {
    background: #F11308;
}

.dictionary{
    margin-top:25px;
    border-top:3px solid #1A1A1A;
    padding-top:15px;
    color:#555;
    font-size:.85rem;
}

.dict-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
}    </style>
</head>
<body>

<div class="container">
    <h1>⚪ KNUDGLOT 🔴</h1>
    
    <div class="mode-selector">
        <button id="btn-to" class="mode-btn active" onclick="setMode('to')">⚪NL → 🔴KN</button>
        <button id="btn-from" class="mode-btn" onclick="setMode('from')">🔴KN → ⚪NL</button>
    </div>

    <textarea id="input" placeholder="Typ Nederlands... (bijv: Hallo, hoe gaat het?)" oninput="processText()"></textarea>
    <div class="output-box" id="output">...</div>

    <div class="speech-controls">
        <select id="voiceSelect" class="voice-select"></select>
        <button class="speak-btn" onclick="speakText()">🔊 SPEAK</button>
    </div>

    <div class="dictionary" style="display:none;">
        <strong>📜 Unique mapping (No Collisions):</strong>
        <div class="dict-grid" id="dict-grid"></div>
    </div>
</div>

<script>
    var currentMode = 'to';
    var VOWELS = "aeiouyéèöüaaeeoouuiieoeuauou";
    
    var syllableMap = {
        "aa": "oa", "ee": "ue", "oo": "au", "uu": "io",
        "ie": "ei", "oe": "ou", "eu": "ae", "ui": "ai", 
        "au": "eo", "ou": "ia", "ij": "ya",
        "a": "o", "e": "u", "i": "e", "o": "a", "u": "i", "y": "y"
    };

    var consMap = {
        "b": "p", "c": "k", "d": "t", "f": "v", "g": "h", 
        "h": "l", "j": "y", "k": "g", "l": "r", "m": "n", 
        "n": "m", "p": "b", "q": "x", "r": "s", "s": "z", 
        "t": "d", "v": "f", "w": "w", "x": "q", "z": "j"
    };

    // SPEECH SETUP
    var synth = window.speechSynthesis;
    var voiceSelect = document.getElementById('voiceSelect');

    function populateVoiceList() {
        var voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        voices.forEach(function(voice) {
            var option = document.createElement('option');
            option.textContent = voice.name + ' (' + voice.lang + ')';
            option.setAttribute('data-lang', voice.lang);
            option.setAttribute('data-name', voice.name);
            
            // Set a default exotic flavor (trying to find a non-Dutch/English one)
            if(voice.lang.includes('fr') || voice.lang.includes('it')) {
                option.selected = true;
            }
            voiceSelect.appendChild(option);
        });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function speakText() {
        var text = document.getElementById('output').innerText;
        if (text === "...") return;

        var utterThis = new SpeechSynthesisUtterance(text);
        var selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
        
        var voices = synth.getVoices();
        for(var i = 0; i < voices.length; i++) {
            if(voices[i].name === selectedOption) {
                utterThis.voice = voices[i];
                break;
            }
        }
        
        utterThis.pitch = 1.2; // Make it slightly higher for a "minion/alien" feel
        utterThis.rate = 0.9;  // Slightly slower to pronounce the odd sounds
        synth.speak(utterThis);
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-to').classList.toggle('active', mode === 'to');
        document.getElementById('btn-from').classList.toggle('active', mode === 'from');
        processText();
    }

    function processText() {
        var text = document.getElementById('input').value;
        var outputDiv = document.getElementById('output');
        if (!text) { outputDiv.innerText = "..."; return; }

        var words = text.split(/(\s+|[.,!?;])/);
        var result = "";

        for (var w = 0; w < words.length; w++) {
            var word = words[w];
            if (word.trim() === "" || /^[.,!?;]$/.test(word)) {
                result += word;
                continue;
            }
            result += (currentMode === 'to') ? encode(word) : decode(word);
        }
        outputDiv.innerText = result;
    }

    function encode(word) {
        var result = "";
        var i = 0;
        while (i < word.length) {
            var char = word[i].toLowerCase();
            if (consMap[char]) {
                result += matchCase(word[i], consMap[char]);
                i++;
            } else if (VOWELS.indexOf(char) !== -1) {
                var cluster = "";
                while (i < word.length && VOWELS.indexOf(word[i].toLowerCase()) !== -1) {
                    cluster += word[i].toLowerCase();
                    i++;
                }
                var rep = syllableMap[cluster] || syllableMap[cluster[0]] || cluster;
                result += matchCase(cluster, rep);
            } else {
                result += word[i];
                i++;
            }
        }
        return result;
    }

    function decode(word) {
        var result = "";
        var i = 0;
        var revSyl = {};
        for (var s in syllableMap) revSyl[syllableMap[s]] = s;
        var revCons = {};
        for (var c in consMap) revCons[consMap[c]] = c;

        while (i < word.length) {
            var char = word[i].toLowerCase();
            if (revCons[char]) {
                result += matchCase(char, revCons[char]);
                i++;
            } else if (VOWELS.indexOf(char) !== -1) {
                var cluster = "";
                while (i < word.length && VOWELS.indexOf(word[i].toLowerCase()) !== -1) {
                    cluster += word[i].toLowerCase();
                    i++;
                }
                var rep = revSyl[cluster] || (cluster[0] ? revSyl[cluster[0]] : cluster);
                result += matchCase(cluster, rep);
            } else {
                result += word[i];
                i++;
            }
        }
        return result;
    }

    function matchCase(original, replacement) {
        if (!original || !replacement) return "";
        if (original[0] === original[0].toUpperCase()) {
            return replacement.charAt(0).toUpperCase() + replacement.slice(1);
        }
        return replacement;
    }

    function buildDictionary() {
        var grid = document.getElementById('dict-grid');
        var keys = Object.keys(syllableMap);
        for (var i = 0; i < keys.length; i++) {
            var item = document.createElement('div');
            item.innerText = keys[i] + " ↔ " + syllableMap[keys[i]];
            grid.appendChild(item);
        }
    }
    buildDictionary();
</script>

</body>
</html>
